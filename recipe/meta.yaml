{% set name = "msbuild-project-tools-server" %}
{% set version = "0.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/tintoy/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: e8ce1259d9953158ba06c6920b05e876a9502fa183cf2770aab278ee0af1ce7f

build:
  noarch: generic
  number: 0

requirements:
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

test:
  commands:
    - {{ name }} &
    - exe_pid=$!
    - trap "kill -SIGTERM ${exe_pid}" SIGTERM

about:
  home: https://github.com/tintoy/{{ name }}
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Language server for MSBuild intellisense (including PackageReference completion).
  dev_url: https://github.com/tintoy/{{ name }}

extra:
  recipe-maintainers:
    - danielnachun
